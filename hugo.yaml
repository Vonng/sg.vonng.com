title: 新加坡生活指南
baseURL: https://sg.vonng.com/
theme: oink
defaultContentLanguage: zh
hasCJKLanguage: true
timeZone: Asia/Singapore
enableRobotsTXT: true
enableEmoji: true
enableGitInfo: false
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    params:
      description: 理解新加坡社会，找到日常生活与人生事务的办事入口。
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
  highlight:
    noClasses: false
outputs:
  home:
  - HTML
  - markdown
  - LLMS
  - NAVJSON
  page:
  - HTML
  - markdown
  section:
  - HTML
  - markdown
taxonomies: {}
sitemap:
  changefreq: monthly
  filename: sitemap.xml
  priority: 0.5
params:
  logo: /logo.svg
  offline_search: true
  offline_search_index: content
  copyright:
    authors: 新加坡生活指南编写组
    from_year: 2026
    to_year: present
  ui:
    preset: paper
    preset_menu:
    - paper
    - slate
    - ink
    - terminal
    theme_color: '#245b54'
    typography: system
    dark_mode: true
    section_index: list
    sidebar_menu_foldable: true
    sidebar_menu_compact: false
    sidebar_expand_levels: 1
    sidebar_menu_truncate: 300
    sidebar_icon_policy: groups
    sidebar_headings: 2
    backlinks: true
    annotation: false
    footer_style: slim
menus:
